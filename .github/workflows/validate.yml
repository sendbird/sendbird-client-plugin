name: validate
# Validate the marketplace and the plugin on every release pull request.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - name: Install pinned Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.278
      - name: Validate the marketplace and the plugin
        run: |
          set -euo pipefail
          claude plugin validate .
          claude plugin validate plugins/sendbird-client
